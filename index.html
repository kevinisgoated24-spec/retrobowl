    <script>
      /* Fade out the loading screen once the game OR the "turn your phone" screen is ready */
      (function () {
        function hideLoad() {
          var l = document.getElementById("rbLoad");
          if (!l) return;
          l.classList.add("out");
          setTimeout(function () { if (l.parentNode) l.parentNode.removeChild(l); }, 700);
        }
        // Always hide after 3s max (up from 2s) so the bar animation finishes
        setTimeout(hideLoad, 3000);
      })();
    </script>

    <script>
      /* mobile: no pinch / double-tap zoom */
      (function () {
        var touch = matchMedia("(pointer: coarse)").matches || "ontouchstart" in window;
        document.getElementById("rbUpright").addEventListener("click", function (e) { e.stopPropagation(); document.body.classList.add("rb-upright"); });
        if (!touch) return;
        ["gesturestart", "gesturechange", "gestureend"].forEach(function (t) { document.addEventListener(t, function (e) { e.preventDefault(); }, { passive: false }); });

      })();

    <script>
      /* Orientation / black-screen fix.
         Problems this solves:
         1. iOS may not apply the CSS portrait-media-query in time, leaving body black
            after the loading screen fades.
         2. When the game is running and the user rotates, GameMaker's WebGL context is
            lost and can't recover — only a reload fixes it.
         Both are handled below with JS, not CSS alone. */
      (function () {
        window.__rbGameStarted = false; // set to true in start() below

        /* --- Part 1: show the "turn your phone" prompt via JS (belt+suspenders) --- */
        function maybeShowTurn() {
          var portrait = window.innerHeight > window.innerWidth;
          var body = document.body;
          var el = document.getElementById("rbTurn");
          if (!el || !body) return;
          if (portrait && !body.classList.contains("rb-upright") && !window.__rbGameStarted) {
            el.style.display = "flex";
          } else {
            el.style.removeProperty("display"); // let CSS take over
          }
        }

        /* --- Part 2: reload on rotation once game is actually running --- */
        // Blue cover to hide the black WebGL flash before reload
        var cover = document.createElement("div");
        cover.style.cssText = "display:none;position:fixed;inset:0;z-index:2147483647;background:#2c68ff;align-items:center;justify-content:center;font-family:'Silkscreen','Courier New',monospace;color:#fff;font-size:5vmin;";
        cover.textContent = "Loading…";
        document.documentElement.appendChild(cover);

        var lastOrient = window.innerHeight > window.innerWidth ? "port" : "land";

        function checkRotate() {
          var now = window.innerHeight > window.innerWidth ? "port" : "land";
          maybeShowTurn();
          if (now === lastOrient) return;
          lastOrient = now;
          if (!window.__rbGameStarted) return;
          cover.style.display = "flex";
          setTimeout(function () { location.reload(); }, 400);
        }

        window.addEventListener("orientationchange", function () { setTimeout(checkRotate, 100); });
        window.addEventListener("resize", function () { setTimeout(checkRotate, 100); });

        // Run once after load to handle initial portrait state
        window.addEventListener("load", function () { setTimeout(maybeShowTurn, 100); });
      })();
    </script>
    <script>
      /* Starting the game:
         - computers: straight away
         - phones/tablets held upright: wait until turned sideways (or "Play upright anyway"),
           so the game sizes itself to the screen it will be played on
         - full screen on phones comes from "Add to Home Screen" (manifest.webmanifest):
           the game then opens like an app with no browser bars. The browser's own
           fullscreen mode isn't used because this game misplaces taps in it.
           Phones get a one-time tip explaining how. */
      window.onload = function () {
        var started = false, body = document.body;
        function start() { if (started) return; started = true; GameMaker_Init(); window.__rbGameStarted = true; if (touch) tip(); }
        var touch = matchMedia("(pointer: coarse)").matches || "ontouchstart" in window;
        if (!touch) return start();
        var upright = matchMedia("(orientation: portrait)");
        function next() { if (!upright.matches || body.classList.contains("rb-upright")) start(); }
        upright.addEventListener ? upright.addEventListener("change", next) : upright.addListener(next);
        document.getElementById("rbUpright").addEventListener("click", function () { setTimeout(next, 0); });
        next();
        function tip() {
          var standalone = matchMedia("(display-mode: fullscreen), (display-mode: standalone)").matches || navigator.standalone === true;
          if (standalone) return;
          try { if (localStorage.getItem("rb.homeTip")) return; } catch (e) {}
          var ua = navigator.userAgent, text = document.getElementById("rbIosText");
          if (/iPhone|iPad|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1))
            text.textContent = 'For full screen: tap Share, then "Add to Home Screen", and play from the icon.';
          else if (/Android/.test(ua))
            text.textContent = 'For full screen: tap the \u22EE menu, then "Add to Home screen" (or "Install app"), and play from the icon.';
          var box = document.getElementById("rbIos");
          var close = function () { box.classList.remove("on"); try { localStorage.setItem("rb.homeTip", "1"); } catch (e) {} };
          box.querySelector("button").addEventListener("click", close);
          box.classList.add("on"); setTimeout(close, 12000);
        }
      };
    </script>
